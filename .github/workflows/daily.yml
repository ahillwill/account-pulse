name: Daily Account Pulse

on:
  schedule:
    - cron: "7 12 * * *"   # 12:07 UTC = 7:07am ET in winter (8:07am in summer). GitHub may start a few minutes late.
  workflow_dispatch:         # lets you click "Run workflow" to trigger it by hand

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Account Pulse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python account_pulse.py

      - name: Commit today's data and dashboard
        run: |
          git config user.name "account-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily run: $(TZ=America/New_York date +'%Y-%m-%d')"
          git push
